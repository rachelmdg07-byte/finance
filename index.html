<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finanzas + Wish List</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#0f0f0f;
--surface:#1a1a1a;
--surface2:#222;
--border:rgba(255,255,255,0.08);
--text:#f0ede8;
--muted:rgba(240,237,232,0.45);
--accent:#c8f563;
--green:#4ecb87;
--red:#ff6b6b;
--blue:#60a5fa;
--yellow:#fbbf24;
--r:12px;
--font:'Sora',sans-serif;
--mono:'DM Mono',monospace;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}

html,body{
height:100%;
overflow:hidden;
background:var(--bg);
color:var(--text);
font-family:var(--font);
}

.app{
display:flex;
flex-direction:column;
height:100vh;
}

.screen{
flex:1;
overflow-y:auto;
padding-bottom:90px;
display:none;
}

.screen.active{
display:block;
}

.top-bar{
padding:20px;
}

.top-bar h1{
font-size:13px;
font-weight:600;
letter-spacing:.12em;
text-transform:uppercase;
color:var(--muted);
}

.nav{
display:flex;
border-top:1px solid var(--border);
background:#111;
padding:10px 0;
}

.nav-btn{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
background:none;
border:none;
color:var(--muted);
font-size:11px;
cursor:pointer;
}

.nav-btn.active{
color:var(--accent);
}

.nav-icon{
font-size:20px;
}

.section{
padding:0 20px 20px;
}

.balance{
font-size:42px;
font-family:var(--mono);
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:var(--r);
padding:16px;
}

.card small{
color:var(--muted);
display:block;
margin-bottom:8px;
}

.card strong{
font-size:22px;
font-family:var(--mono);
}

.green{
color:var(--green);
}

.red{
color:var(--red);
}

.field-group{
margin-bottom:18px;
}

.field-label{
font-size:11px;
margin-bottom:8px;
color:var(--muted);
text-transform:uppercase;
letter-spacing:.1em;
}

.text-input,
.desc-input,
.monto-input{
width:100%;
background:var(--surface);
border:1px solid var(--border);
border-radius:var(--r);
padding:14px;
color:var(--text);
font-family:var(--font);
outline:none;
}

.monto-input{
font-family:var(--mono);
font-size:24px;
}

.desc-input{
height:90px;
resize:none;
}

.save-btn{
width:100%;
padding:15px;
border:none;
border-radius:var(--r);
font-weight:700;
cursor:pointer;
margin-top:10px;
}

.save-btn.green{
background:var(--green);
color:#000;
}

.save-btn.red{
background:var(--red);
color:#fff;
}

.save-btn.blue{
background:var(--blue);
color:#000;
}

.cats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.cat{
background:var(--surface);
border:1px solid var(--border);
padding:10px;
border-radius:10px;
text-align:center;
cursor:pointer;
}

.cat.sel{
border-color:var(--accent);
}

.cat span{
display:block;
margin-top:4px;
font-size:11px;
color:var(--muted);
}

.tx{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 0;
border-bottom:1px solid var(--border);
}

.tx-left{
display:flex;
gap:12px;
align-items:center;
}

.tx-icon{
width:40px;
height:40px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:var(--surface);
}

.meta-card{
background:var(--surface);
border:1px solid var(--border);
border-radius:var(--r);
padding:16px;
margin-bottom:12px;
}

.meta-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.meta-track{
height:8px;
background:var(--surface2);
border-radius:5px;
overflow:hidden;
margin:10px 0;
}

.meta-fill{
height:100%;
background:var(--accent);
}

.meta-nums{
display:flex;
justify-content:space-between;
font-size:12px;
color:var(--muted);
font-family:var(--mono);
}

.empty{
padding:50px 20px;
text-align:center;
color:var(--muted);
}

.toggle-btn{
width:100%;
padding:12px;
background:none;
border:1px dashed var(--border);
border-radius:var(--r);
color:var(--muted);
cursor:pointer;
margin-bottom:16px;
}

.toast{
position:fixed;
bottom:100px;
left:50%;
transform:translateX(-50%);
background:var(--surface);
padding:10px 20px;
border-radius:20px;
border:1px solid var(--border);
opacity:0;
transition:.3s;
}

.toast.show{
opacity:1;
}

</style>
</head>
<body>

<div class="app">

<!-- DASH -->
<div class="screen active" id="page-dash">

<div class="top-bar">
<h1>📊 Resumen</h1>
</div>

<div class="section">

<div class="balance" id="balance">
L 0.00
</div>

<div class="cards">

<div class="card">
<small>Ingresos</small>
<strong class="green" id="ingresos">
L 0
</strong>
</div>

<div class="card">
<small>Egresos</small>
<strong class="red" id="egresos">
L 0
</strong>
</div>

</div>

</div>

</div>

<!-- FORM -->
<div class="screen" id="page-form">

<div class="top-bar">
<h1>➕ Nueva entrada</h1>
</div>

<div class="section">

<div class="field-group">

<div class="field-label">
Tipo
</div>

<div style="display:flex;gap:8px">

<button class="save-btn green"
onclick="setTipo('ingreso')">
Ingreso
</button>

<button class="save-btn red"
onclick="setTipo('egreso')">
Egreso
</button>

</div>

</div>

<div class="field-group">

<div class="field-label">
Monto
</div>

<input class="monto-input"
type="number"
id="monto"
placeholder="0.00">

</div>

<div class="field-group">

<div class="field-label">
Categoría
</div>

<div class="cats" id="cats"></div>

</div>

<div class="field-group">

<div class="field-label">
Descripción
</div>

<textarea class="desc-input"
id="desc"></textarea>

</div>

<button class="save-btn blue"
onclick="guardar()">
Guardar
</button>

</div>

</div>

<!-- HISTORIAL -->
<div class="screen" id="page-hist">

<div class="top-bar">
<h1>🗂 Historial</h1>
</div>

<div class="section">

<div id="historial"></div>

</div>

</div>

<!-- METAS -->
<div class="screen" id="page-metas">

<div class="top-bar">
<h1>🎯 Metas</h1>
</div>

<div class="section">

<div id="metas"></div>

</div>

</div>

<!-- WISHLIST -->
<div class="screen" id="page-wishlist">

<div class="top-bar">
<h1>🛍 Wish List</h1>
</div>

<div class="section">

<button class="toggle-btn"
onclick="toggleWishForm()">
+ Nueva compra deseada
</button>

<div id="wish-form"
style="display:none">

<div class="field-group">

<div class="field-label">
Producto
</div>

<input class="text-input"
id="w-nombre"
placeholder="Ej: iPhone">

</div>

<div class="field-group">

<div class="field-label">
Presupuesto
</div>

<input class="monto-input"
type="number"
id="w-precio"
placeholder="0">

</div>

<div class="field-group">

<div class="field-label">
Fecha
</div>

<input class="text-input"
type="date"
id="w-fecha">

</div>

<div class="field-group">

<div class="field-label">
Notas
</div>

<textarea class="desc-input"
id="w-notas"></textarea>

</div>

<button class="save-btn blue"
onclick="crearWish()">
Guardar Wish
</button>

</div>

<div id="wishlist"></div>

</div>

</div>

<!-- NAV -->
<nav class="nav">

<button class="nav-btn active"
onclick="go('dash',this)">
<span class="nav-icon">◈</span>
<span>Resumen</span>
</button>

<button class="nav-btn"
onclick="go('form',this)">
<span class="nav-icon">⊕</span>
<span>Registrar</span>
</button>

<button class="nav-btn"
onclick="go('hist',this)">
<span class="nav-icon">≡</span>
<span>Historial</span>
</button>

<button class="nav-btn"
onclick="go('metas',this)">
<span class="nav-icon">🎯</span>
<span>Metas</span>
</button>

<button class="nav-btn"
onclick="go('wishlist',this)">
<span class="nav-icon">🛍</span>
<span>Wish</span>
</button>

</nav>

</div>

<div class="toast" id="toast"></div>

<script>

const CATS={
ingreso:[
{k:'Salario',e:'💼'},
{k:'Venta',e:'🏷'},
{k:'Freelance',e:'🛠'}
],
egreso:[
{k:'Comida',e:'🍔'},
{k:'Transporte',e:'🚗'},
{k:'Ropa',e:'👕'},
{k:'Ocio',e:'🎉'},
{k:'Salud',e:'❤️'}
]
};

let tipo='ingreso';
let cat='';
let data=[];
let wishlist=[];

function save(){
localStorage.setItem('data',JSON.stringify(data));
localStorage.setItem('wishlist',JSON.stringify(wishlist));
}

function load(){

try{
data=JSON.parse(localStorage.getItem('data'))||[];
}catch{
data=[];
}

try{
wishlist=JSON.parse(localStorage.getItem('wishlist'))||[];
}catch{
wishlist=[];
}

}

function fmt(n){
return Number(n).toLocaleString('es-HN',{
minimumFractionDigits:2
});
}

function toast(msg){

const t=document.getElementById('toast');

t.textContent=msg;

t.classList.add('show');

setTimeout(()=>{
t.classList.remove('show');
},2000);

}

function go(id,btn){

document.querySelectorAll('.screen')
.forEach(x=>x.classList.remove('active'));

document.getElementById('page-'+id)
.classList.add('active');

document.querySelectorAll('.nav-btn')
.forEach(x=>x.classList.remove('active'));

btn.classList.add('active');

if(id==='dash')renderDash();
if(id==='hist')renderHist();
if(id==='wishlist')renderWishlist();

}

function setTipo(t){
tipo=t;
renderCats();
}

function renderCats(){

document.getElementById('cats').innerHTML=
CATS[tipo].map(c=>`

<div class="cat ${cat===c.k?'sel':''}"
onclick="selCat('${c.k}')">

<div>${c.e}</div>
<span>${c.k}</span>

</div>

`).join('');

}

function selCat(k){
cat=k;
renderCats();
}

function guardar(){

const monto=parseFloat(
document.getElementById('monto').value
);

const desc=document.getElementById('desc').value;

if(!monto){
toast('Ingresa monto');
return;
}

if(!cat){
toast('Selecciona categoría');
return;
}

data.unshift({
id:Date.now(),
tipo,
cat,
monto,
desc,
fecha:new Date().toISOString()
});

save();

document.getElementById('monto').value='';
document.getElementById('desc').value='';

toast('Guardado');

renderDash();

}

function renderDash(){

const ing=data
.filter(x=>x.tipo==='ingreso')
.reduce((a,b)=>a+b.monto,0);

const egr=data
.filter(x=>x.tipo==='egreso')
.reduce((a,b)=>a+b.monto,0);

document.getElementById('balance')
.textContent='L '+fmt(ing-egr);

document.getElementById('ingresos')
.textContent='L '+fmt(ing);

document.getElementById('egresos')
.textContent='L '+fmt(egr);

}

function renderHist(){

document.getElementById('historial').innerHTML=
data.length?

data.map(e=>`

<div class="tx">

<div class="tx-left">

<div class="tx-icon">
${CATS[e.tipo].find(x=>x.k===e.cat)?.e||'•'}
</div>

<div>
<div>${e.cat}</div>
<small>${e.desc||''}</small>
</div>

</div>

<div class="${e.tipo==='ingreso'?'green':'red'}">

${e.tipo==='ingreso'?'+':'-'}
L${fmt(e.monto)}

</div>

</div>

`).join('')

:

'<div class="empty">Sin movimientos</div>';

}

function toggleWishForm(){

const f=document.getElementById('wish-form');

f.style.display=
f.style.display==='none'
?'block'
:'none';

}

function crearWish(){

const nombre=document.getElementById('w-nombre').value;
const precio=document.getElementById('w-precio').value;
const fecha=document.getElementById('w-fecha').value;
const notas=document.getElementById('w-notas').value;

if(!nombre){
toast('Escribe un nombre');
return;
}

wishlist.unshift({
id:Date.now(),
nombre,
precio,
fecha,
notas,
done:false
});

save();

document.getElementById('w-nombre').value='';
document.getElementById('w-precio').value='';
document.getElementById('w-fecha').value='';
document.getElementById('w-notas').value='';

renderWishlist();

toast('Wish agregada');

}

function toggleWish(id){

const w=wishlist.find(x=>x.id===id);

w.done=!w.done;

save();

renderWishlist();

}

function renderWishlist(){

document.getElementById('wishlist').innerHTML=

wishlist.length?

wishlist.map(w=>`

<div class="meta-card">

<div class="meta-header">

<div>
<strong>${w.nombre}</strong>
</div>

<button class="save-btn ${w.done?'green':'blue'}"
style="width:auto;padding:8px 14px"
onclick="toggleWish(${w.id})">

${w.done?'✅ Comprado':'🛒 Pendiente'}

</button>

</div>

<div class="meta-nums">
<span>Presupuesto</span>
<span>L${fmt(w.precio||0)}</span>
</div>

${w.fecha?`

<div style="margin-top:10px;color:var(--muted)">
📅 ${w.fecha}
</div>

`:''}

${w.notas?`

<div style="margin-top:10px">
${w.notas}
</div>

`:''}

</div>

`).join('')

:

'<div class="empty">No tienes wishes aún</div>';

}

load();
renderCats();
renderDash();

</script>

</body>
</html>
