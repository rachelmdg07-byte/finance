<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<title>Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #222;
  --border: rgba(255,255,255,0.08);
  --text: #f0ede8;
  --muted: rgba(240,237,232,0.45);
  --accent: #c8f563;
  --accent-dim: rgba(200,245,99,0.12);
  --red: #ff6b6b;
  --red-dim: rgba(255,107,107,0.12);
  --green: #4ecb87;
  --green-dim: rgba(78,203,135,0.12);
  --blue: #60a5fa;
  --r: 12px;
  --font: 'Sora', sans-serif;
  --mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

/* LAYOUT */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 0 80px; }
.screen::-webkit-scrollbar { display: none; }

/* NAV */
.nav { display: flex; border-top: 1px solid var(--border); background: rgba(15,15,15,0.95); backdrop-filter: blur(20px); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); flex-shrink: 0; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--muted); font-family: var(--font); font-size: 10px; cursor: pointer; padding: 4px; transition: color .2s; }
.nav-btn.active { color: var(--accent); }
.nav-icon { font-size: 22px; line-height: 1; }

/* PAGES */
.page { display: none; }
.page.active { display: block; }

/* HEADER */
.top-bar { padding: 16px 20px 0; padding-top: calc(16px + env(safe-area-inset-top)); }
.top-bar h1 { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* DASHBOARD */
.balance-hero { padding: 20px 20px 0; }
.balance-label { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.balance-amount { font-family: var(--mono); font-size: 42px; font-weight: 300; letter-spacing: -1px; color: var(--text); }
.balance-amount.pos { color: var(--green); }
.balance-amount.neg { color: var(--red); }

.cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 20px 0; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; }
.stat-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.stat-val { font-family: var(--mono); font-size: 20px; font-weight: 400; }
.stat-val.green { color: var(--green); }
.stat-val.red { color: var(--red); }
.stat-count { font-size: 11px; color: var(--muted); margin-top: 2px; }

.section { padding: 20px 20px 0; }
.section-title { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

/* BAR CHART */
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-cat { font-size: 12px; color: var(--text); width: 80px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .4s cubic-bezier(.4,0,.2,1); }
.bar-val { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 64px; text-align: right; flex-shrink: 0; }

/* TRANSACTIONS LIST */
.tx-list { display: flex; flex-direction: column; gap: 1px; }
.tx-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.tx-item:last-child { border-bottom: none; }
.tx-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.tx-icon.ing { background: var(--green-dim); }
.tx-icon.egr { background: var(--red-dim); }
.tx-info { flex: 1; min-width: 0; }
.tx-cat { font-size: 14px; font-weight: 600; color: var(--text); }
.tx-desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-right { text-align: right; flex-shrink: 0; }
.tx-amt { font-family: var(--mono); font-size: 15px; font-weight: 500; }
.tx-amt.ing { color: var(--green); }
.tx-amt.egr { color: var(--red); }
.tx-date { font-size: 11px; color: var(--muted); }

/* MONTHLY BARS */
.month-chart { display: flex; align-items: flex-end; gap: 6px; height: 100px; }
.month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.month-bars { display: flex; gap: 2px; align-items: flex-end; height: 80px; width: 100%; justify-content: center; }
.month-bar { width: 10px; border-radius: 3px 3px 0 0; min-height: 2px; }
.month-bar.ing { background: var(--green); }
.month-bar.egr { background: var(--red); }
.month-label { font-size: 9px; color: var(--muted); font-family: var(--mono); }

/* FORM PAGE */
.form-wrap { padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top)); }
.type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
.type-btn { padding: 14px; border-radius: var(--r); border: 1.5px solid var(--border); background: var(--surface); color: var(--muted); font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
.type-btn.on-ing { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.type-btn.on-egr { border-color: var(--red); background: var(--red-dim); color: var(--red); }

.field-group { margin-bottom: 20px; }
.field-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.monto-input-wrap { position: relative; }
.currency { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 18px; color: var(--muted); }
.monto-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); font-family: var(--mono); font-size: 28px; font-weight: 300; padding: 14px 14px 14px 42px; outline: none; transition: border .2s; -webkit-appearance: none; }
.monto-input:focus { border-color: var(--accent); }

.desc-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); font-family: var(--font); font-size: 15px; padding: 13px 14px; outline: none; transition: border .2s; resize: none; height: 80px; }
.desc-input:focus { border-color: var(--accent); }
::placeholder { color: var(--muted); }

.cats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; transition: all .15s; }
.cat-pill .emoji { font-size: 20px; line-height: 1; }
.cat-pill .name { font-size: 11px; color: var(--muted); text-align: center; line-height: 1.2; }
.cat-pill.sel { border-color: var(--accent); background: var(--accent-dim); }
.cat-pill.sel .name { color: var(--accent); }

.save-btn { width: 100%; padding: 16px; border-radius: var(--r); border: none; font-family: var(--font); font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: all .15s; letter-spacing: .02em; }
.save-btn:active { transform: scale(0.98); }
.save-btn.ing { background: var(--green); color: #0f0f0f; }
.save-btn.egr { background: var(--red); color: #fff; }
.save-btn:disabled { opacity: 0.4; }

/* HISTORY PAGE */
.hist-top { padding: 16px 20px 0; padding-top: calc(16px + env(safe-area-inset-top)); }
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.filter-row::-webkit-scrollbar { display: none; }
.f-chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
.f-chip.active { background: var(--accent); border-color: var(--accent); color: #0f0f0f; }

/* TOAST */
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 600; opacity: 0; transition: all .25s; pointer-events: none; z-index: 999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* EMPTY */
.empty { text-align: center; padding: 3rem 2rem; color: var(--muted); }
.empty .big { font-size: 40px; margin-bottom: 12px; }
.empty p { font-size: 14px; line-height: 1.6; }

/* DELETE */
.tx-item { position: relative; overflow: hidden; }
.del-btn { background: var(--red); border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 0 14px; border-radius: 8px; margin-left: 8px; flex-shrink: 0; height: 38px; display: flex; align-items: center; opacity: 0.7; }
.del-btn:active { opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <!-- DASHBOARD -->
  <div class="screen page active" id="page-dash">
    <div class="top-bar"><h1>📊 Resumen</h1></div>
    <div class="balance-hero">
      <div class="balance-label">Balance neto</div>
      <div class="balance-amount" id="d-balance">L 0.00</div>
    </div>
    <div class="cards-row">
      <div class="stat-card">
        <div class="stat-label">Ingresos</div>
        <div class="stat-val green" id="d-ing">L 0</div>
        <div class="stat-count" id="d-ing-n">0 entradas</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Egresos</div>
        <div class="stat-val red" id="d-egr">L 0</div>
        <div class="stat-count" id="d-egr-n">0 entradas</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Por mes</div>
      <div class="month-chart" id="d-months"></div>
    </div>
    <div class="section">
      <div class="section-title">Top categorías <span style="font-size:10px;font-weight:400;letter-spacing:0;color:var(--muted)">por gasto</span></div>
      <div class="bar-chart" id="d-cats"></div>
    </div>
    <div class="section">
      <div class="section-title">Recientes</div>
      <div class="tx-list" id="d-recent"></div>
    </div>
  </div>

  <!-- FORM -->
  <div class="screen page" id="page-form">
    <div class="form-wrap">
      <div class="top-bar" style="padding:0 0 20px"><h1>✚ Nueva entrada</h1></div>

      <div class="type-toggle">
        <button class="type-btn on-ing" id="btn-ing" onclick="setTipo('ingreso')">↓ Ingreso</button>
        <button class="type-btn" id="btn-egr" onclick="setTipo('egreso')">↑ Egreso</button>
      </div>

      <div class="field-group">
        <div class="field-label">Monto</div>
        <div class="monto-input-wrap">
          <span class="currency">L</span>
          <input class="monto-input" type="number" id="f-monto" placeholder="0.00" inputmode="decimal" min="0" step="0.01">
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">Categoría</div>
        <div class="cats-grid" id="f-cats"></div>
      </div>

      <div class="field-group">
        <div class="field-label">Descripción</div>
        <textarea class="desc-input" id="f-desc" placeholder="Opcional..."></textarea>
      </div>

      <button class="save-btn ing" id="save-btn" onclick="guardar()">Guardar ingreso</button>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="screen page" id="page-hist">
    <div class="hist-top">
      <div class="top-bar" style="padding:0 0 12px"><h1>🗂 Historial</h1></div>
      <div class="filter-row" id="hist-filters"></div>
    </div>
    <div style="padding:0 20px">
      <div class="tx-list" id="hist-list"></div>
    </div>
  </div>

  <!-- NAV -->
  <nav class="nav">
    <button class="nav-btn active" onclick="goPage('dash',this)">
      <span class="nav-icon">◈</span><span>Resumen</span>
    </button>
    <button class="nav-btn" onclick="goPage('form',this)">
      <span class="nav-icon">⊕</span><span>Registrar</span>
    </button>
    <button class="nav-btn" onclick="goPage('hist',this)">
      <span class="nav-icon">≡</span><span>Historial</span>
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {
  ingreso: [
    {k:'Salario',e:'💼'},{k:'Freelance',e:'🛠'},{k:'Inversión',e:'📈'},
    {k:'Regalo',e:'🎁'},{k:'Venta',e:'🏷'},{k:'Otro',e:'➕'}
  ],
  egreso: [
    {k:'Comida',e:'🍽'},{k:'Transporte',e:'🚗'},{k:'Casa',e:'🏠'},
    {k:'Gym',e:'🏋'},{k:'Ocio',e:'🎉'},{k:'Educación',e:'📚'},
    {k:'Teléfono',e:'📱'},{k:'Ropa',e:'👕'},{k:'Salud',e:'❤️‍🩹'},
    {k:'Supermercado',e:'🛒'},{k:'Servicios',e:'💡'},{k:'Otro',e:'•••'}
  ]
};

let tipo = 'ingreso', cat = '', data = [];

function save() { localStorage.setItem('finz_data', JSON.stringify(data)); }
function load() { try { data = JSON.parse(localStorage.getItem('finz_data') || '[]'); } catch(e) { data = []; } }
function fmt(n) { return n.toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(iso) { return new Date(iso).toLocaleDateString('es-HN',{day:'2-digit',month:'short'}); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

function goPage(id, btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(id==='dash') renderDash();
  if(id==='hist') renderHist();
}

// FORM
function setTipo(t) {
  tipo = t; cat = '';
  const bi = document.getElementById('btn-ing'), be = document.getElementById('btn-egr');
  bi.className = 'type-btn' + (t==='ingreso'?' on-ing':'');
  be.className = 'type-btn' + (t==='egreso'?' on-egr':'');
  document.getElementById('save-btn').className = 'save-btn ' + (t==='ingreso'?'ing':'egr');
  document.getElementById('save-btn').textContent = 'Guardar ' + t;
  renderCats();
}

function renderCats() {
  const grid = document.getElementById('f-cats');
  grid.innerHTML = CATS[tipo].map(c=>`
    <div class="cat-pill${cat===c.k?' sel':''}" onclick="selCat('${c.k}',this)">
      <span class="emoji">${c.e}</span>
      <span class="name">${c.k}</span>
    </div>`).join('');
}

function selCat(k, el) {
  cat = k;
  document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('sel'));
  el.classList.add('sel');
}

function guardar() {
  const monto = parseFloat(document.getElementById('f-monto').value);
  const desc = document.getElementById('f-desc').value.trim();
  if (!monto || monto <= 0) { toast('Ingresa un monto válido'); return; }
  if (!cat) { toast('Selecciona una categoría'); return; }
  data.unshift({ id: Date.now(), tipo, cat, monto, desc, fecha: new Date().toISOString() });
  if (data.length > 1000) data = data.slice(0,1000);
  save();
  toast(tipo==='ingreso'?'✓ Ingreso guardado':'✓ Gasto guardado');
  document.getElementById('f-monto').value = '';
  document.getElementById('f-desc').value = '';
  cat = '';
  renderCats();
}

// DASHBOARD
function renderDash() {
  const ing = data.filter(e=>e.tipo==='ingreso');
  const egr = data.filter(e=>e.tipo==='egreso');
  const sumIng = ing.reduce((s,e)=>s+e.monto,0);
  const sumEgr = egr.reduce((s,e)=>s+e.monto,0);
  const balance = sumIng - sumEgr;

  const el = document.getElementById('d-balance');
  el.textContent = 'L ' + fmt(Math.abs(balance));
  el.className = 'balance-amount ' + (balance>=0?'pos':'neg');
  document.getElementById('d-ing').textContent = 'L ' + fmt(sumIng);
  document.getElementById('d-egr').textContent = 'L ' + fmt(sumEgr);
  document.getElementById('d-ing-n').textContent = ing.length + ' entradas';
  document.getElementById('d-egr-n').textContent = egr.length + ' entradas';

  // Monthly chart
  const months = {};
  data.forEach(e=>{
    const d = new Date(e.fecha);
    const k = d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0');
    const label = d.toLocaleDateString('es-HN',{month:'short'});
    if(!months[k]) months[k]={label,ing:0,egr:0};
    if(e.tipo==='ingreso') months[k].ing+=e.monto;
    else months[k].egr+=e.monto;
  });
  const mKeys = Object.keys(months).sort().slice(-6);
  const maxM = Math.max(...mKeys.map(k=>Math.max(months[k].ing,months[k].egr)),1);
  document.getElementById('d-months').innerHTML = mKeys.length ? mKeys.map(k=>{
    const m = months[k];
    const ih = Math.round((m.ing/maxM)*72);
    const eh = Math.round((m.egr/maxM)*72);
    return `<div class="month-col">
      <div class="month-bars">
        <div class="month-bar ing" style="height:${Math.max(ih,2)}px"></div>
        <div class="month-bar egr" style="height:${Math.max(eh,2)}px"></div>
      </div>
      <div class="month-label">${m.label}</div>
    </div>`;
  }).join('') : '<div style="color:var(--muted);font-size:12px">Sin datos aún</div>';

  // Cat chart
  const catT = {};
  egr.forEach(e=>{catT[e.cat]=(catT[e.cat]||0)+e.monto;});
  const topCats = Object.entries(catT).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxC = topCats[0]?.[1] || 1;
  document.getElementById('d-cats').innerHTML = topCats.length ? topCats.map(([c,v])=>`
    <div class="bar-row">
      <div class="bar-cat">${c}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round((v/maxC)*100)}%;background:var(--red)"></div></div>
      <div class="bar-val">L${fmt(v)}</div>
    </div>`).join('') : '<div style="color:var(--muted);font-size:12px">Sin egresos aún</div>';

  // Recent
  const recent = data.slice(0,8);
  document.getElementById('d-recent').innerHTML = recent.length ? recent.map(e=>`
    <div class="tx-item">
      <div class="tx-icon ${e.tipo==='ingreso'?'ing':'egr'}">${CATS[e.tipo].find(c=>c.k===e.cat)?.e||'•'}</div>
      <div class="tx-info">
        <div class="tx-cat">${e.cat}</div>
        <div class="tx-desc">${e.desc||fmtDate(e.fecha)}</div>
      </div>
      <div class="tx-right">
        <div class="tx-amt ${e.tipo==='ingreso'?'ing':'egr'}">${e.tipo==='ingreso'?'+':'-'}L${fmt(e.monto)}</div>
        <div class="tx-date">${fmtDate(e.fecha)}</div>
      </div>
    </div>`).join('') : '<div class="empty"><div class="big">📭</div><p>Aún no hay entradas.<br>Registra tu primera transacción.</p></div>';
}

// HISTORY
let histFilter = 'todos';
function renderHist() {
  const cats = ['todos','ingreso','egreso',...new Set(data.map(e=>e.cat))];
  document.getElementById('hist-filters').innerHTML = cats.map(c=>`
    <div class="f-chip${histFilter===c?' active':''}" onclick="setHistFilter('${c}')">${c}</div>`).join('');

  const filtered = histFilter==='todos' ? data :
    histFilter==='ingreso'||histFilter==='egreso' ? data.filter(e=>e.tipo===histFilter) :
    data.filter(e=>e.cat===histFilter);

  document.getElementById('hist-list').innerHTML = filtered.length ? filtered.map(e=>`
    <div class="tx-item">
      <div class="tx-icon ${e.tipo==='ingreso'?'ing':'egr'}">${CATS[e.tipo].find(c=>c.k===e.cat)?.e||'•'}</div>
      <div class="tx-info">
        <div class="tx-cat">${e.cat}</div>
        <div class="tx-desc">${e.desc||'—'} · ${fmtDate(e.fecha)}</div>
      </div>
      <div class="tx-right">
        <div class="tx-amt ${e.tipo==='ingreso'?'ing':'egr'}">${e.tipo==='ingreso'?'+':'-'}L${fmt(e.monto)}</div>
      </div>
      <button class="del-btn" onclick="borrar(${e.id})">🗑</button>
    </div>`).join('') :
    '<div class="empty"><div class="big">🔍</div><p>Sin resultados para este filtro.</p></div>';
}

function setHistFilter(f) { histFilter=f; renderHist(); }

function borrar(id) {
  data = data.filter(e=>e.id!==id); save(); renderHist();
  toast('Entrada eliminada');
}

// INIT
